<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{userTaskFormBean.finalReviewFormTitle}</ui:define>
    <ui:define name="content">
      <script type="text/javascript">
        window.taskName = "#{userTaskFormBean.finalReviewFormTitle}";
        window.processSteps = #{data.steps};
        window.currentProcessStep = #{data.actualStepIndex};
      </script>

      <h:outputStylesheet library="css" name="express.css" />
      <h:outputStylesheet library="css" name="utility.css" />

      <h:form id="form" styleClass="ui-g">
        <div class="ui-g-12 u-padding-0">
          <ic:com.axonivy.utils.axonivyexpress.components.FinishedUserTasksForm id="finished-tasks-component" finishedTasks="#{data.finishedTasks}" />
        </div>

        <br />
        <div class="ui-g-12 u-padding-0 u-text-align-right MarTop10">
          <p:commandLink id="cancel" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/components/Common/Cancel')}" immediate="true" update="form"
            actionListener="#{logic.cancel}" styleClass="u-mar-right-10"/>
          <p:commandButton id="acknowledged" value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/workflowExecution/FinalReviewForm/Noticed')}" update="form"
            icon="#{visibilityBean.generateButtonIcon('si si-check-1')}" actionListener="#{logic.close}" styleClass="MarLeft10"/>
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
