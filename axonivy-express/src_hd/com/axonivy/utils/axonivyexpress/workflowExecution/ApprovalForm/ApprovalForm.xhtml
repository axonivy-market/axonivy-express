<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{approvalFormBean.title}</ui:define>
    <ui:define name="content">
      <script type="text/javascript">
        window.taskName = "#{approvalFormBean.title}";
        var steps = '#{data.steps}';
        window.processSteps = steps.substring(1, steps.length - 1);
        window.currentProcessStep = #{data.actualStepIndex};
      </script>

      <h:outputStylesheet library="css" name="express.css" />
      <h:outputStylesheet library="css" name="utility.css" />

      <h:form id="form" styleClass="ui-g ">
        <div>
          <ic:com.axonivy.utils.axonivyexpress.components.FinishedUserTasksForm id="finished-tasks-component" finishedTasks="#{data.finishedTasks}" />
        </div>

        <div class="approval-comment-container ui-g-12 u-padding-0">
          <h:panelGroup styleClass="ui-g card ui-fluid">
            <h:outputText value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/workflowExecution/ApprovalForm/CommentLabel')}" styleClass="review-content-title" />

            <p:inputTextarea id="comment" styleClass="approval-comment" value="#{data.comment}" rows="4" />
          </h:panelGroup>
        </div>

        <div class="ui-g-12 u-padding-0 u-text-align-right">
          <p:commandLink id="cancel-btn" value="#{ivy.cms.co('/Dialogs/com/axonivy/portal/components/Common/Cancel')}" immediate="true" update="form"
            actionListener="#{logic.cancel}" styleClass="u-mar-right-15" />
          <p:commandButton id="refuse-btn" value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/workflowExecution/ApprovalForm/Reject')}" update="form" icon="#{visibilityBean.generateButtonIcon('si si-delete')}"
            actionListener="#{logic.closeDeny}" styleClass="ui-button-secondary u-mar-right-5" />
          <p:commandButton id="approve-btn" value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/workflowExecution/ApprovalForm/Approve')}" update="form"
            icon="#{visibilityBean.generateButtonIcon('si si-check-1')}" actionListener="#{logic.closeApprove}" styleClass="u-mar-right-5"/>
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
