<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/ExpressBusinessView/ExpressWorkflowName', [expressBusinessViewBean.expressCase.getId()])}</ui:define>
    <ui:define name="content">
      <script type="text/javascript">
        window.isWorkingOnATask = false;
        window.isHideCaseInfo = true;
        window.isHideTaskName = true;
        window.isHideTaskAction = true;
        window.caseId = #{expressBusinessViewBean.expressCase.id};
        window.currentProcessStep = #{expressBusinessViewBean.getFinishedActualStepIndex()};
      </script>

      <h:outputStylesheet library="css" name="express.css" />
      <h:outputStylesheet library="css" name="utility.css" />

      <h:form id="express-view-form" styleClass="express-view-form">
        <h:panelGroup id="user-finished-tasks-container" layout="block" rendered="#{not empty expressBusinessViewBean.finishedTasks}">
          <ic:com.axonivy.utils.axonivyexpress.components.FinishedUserTasksForm id="finished-tasks-component"
            finishedTasks="#{expressBusinessViewBean.finishedTasks}"
            expressCase="#{expressBusinessViewBean.expressCase}"
            expandAllSteps="true"/>
        </h:panelGroup>

        <h:panelGroup rendered="#{empty expressBusinessViewBean.finishedTasks}" id="empty-finished-tasks-container" layout="block" styleClass="ui-g card empty-finished-tasks-container">
          <div class="ui-g-12 no-item-panel">
            <i class="si si-startup-launch" />
            <h:outputText styleClass="no-item-header" value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/ExpressBusinessView/ExpressNoItem')}" />
            <h:outputText styleClass="no-item-detail" value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/ExpressBusinessView/ExpressNoItemDescription')} ##{expressBusinessViewBean.expressCase.id}" />
          </div>
        </h:panelGroup>

        <div class="button-group">
          <p:commandButton id="cancel-btn" value="#{ivy.cms.co('/Labels/Close')}" immediate="true"
            actionListener="#{logic.cancel}" styleClass="Fright" icon="si si-remove" />
        </div>
      </h:form>

    </ui:define>
  </ui:composition>
</h:body>

</html>
