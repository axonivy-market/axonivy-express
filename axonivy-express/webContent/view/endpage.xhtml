<html xmlns="http://www.w3.org/1999/xhtml" xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
  xmlns:ic="http://ivyteam.ch/jsf/component" xmlns:p="http://primefaces.org/ui"
  xmlns:pe="http://primefaces.org/ui/extensions">
<h:body>
  <ui:composition template="/layouts/frame-10-full-width.xhtml">
    <ui:define name="title">#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/EndPage/Title')}</ui:define>
    <ui:define name="content">
      <script type="text/javascript">
        window.isWorkingOnATask = false;
        window.isHideCaseInfo = true;
        window.isHideTaskName = true;
        window.isHideTaskAction = true;
      </script>

      <h:outputStylesheet library="css" name="express.css" />
      <h:outputStylesheet library="css" name="utility.css" />
      <h:form id="form" styleClass="ui-g">
        <h:panelGrid columns="1" styleClass="ui-g-12 u-text-align-center">
          <p:spacer height="30" />
          <h3>
            <i class="si si-check-1" /> #{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/EndPage/Title')}
          </h3>
          <p:outputLabel value="#{ivy.cms.co('/Dialogs/com/axonivy/utils/axonivyexpress/generic/EndPage/Subtitle')}" />
          <br />

          <p:commandButton id="close-button" actionListener="#{logic.close}"
            value="#{ivy.cms.co('/Labels/Close')}" update="form" 
            icon="#{visibilityBean.generateButtonIcon('si si-house-chimney-2')}" />
        </h:panelGrid>
      </h:form>
    </ui:define>
  </ui:composition>
</h:body>

</html>
